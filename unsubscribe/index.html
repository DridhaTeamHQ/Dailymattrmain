<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage your subscription — dailymattr</title>
  <meta name="robots" content="noindex" />
  <!-- the URL carries the reader's email and token: never send it as a Referer -->
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2" />
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=2" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/src/unsubscribe.css" />
  <!-- no Google tag on this page: page_location would carry the email and token -->
</head>
<body class="unsub-page">
  <header class="unsub-header">
    <a class="brand" href="/"><img src="/assets/logo.svg" width="156" height="32" alt="dailymattr" /></a>
  </header>

  <main class="unsub-main">
    <section class="unsub-card" aria-live="polite">
      <div id="unsub-loading">
        <h1>Updating your subscription...</h1>
      </div>

      <div id="unsub-success" hidden>
        <h1 id="unsub-success-title"></h1>
        <p id="unsub-success-text"></p>
        <button class="btn btn-dark unsub-btn" id="unsub-resubscribe" type="button" hidden>Resubscribe</button>
      </div>

      <div id="unsub-error" hidden>
        <h1>This link didn't work</h1>
        <p id="unsub-error-text"></p>
        <p>If you keep getting dailymattr emails, reply to any of them and we'll remove you.</p>
      </div>

      <p class="unsub-email" id="unsub-email-row" hidden>Email address: <strong id="unsub-email"></strong></p>
    </section>
  </main>

  <script type="module" src="/src/unsubscribe.js"></script>
</body>
</html>
