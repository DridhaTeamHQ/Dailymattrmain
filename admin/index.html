<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><meta name="robots" content="noindex,nofollow" /><title>Admin — dailymattr</title><link rel="stylesheet" href="/src/admin.css" /></head>
<body><main class="admin-shell"><section id="login-view" class="panel login-panel"><aside class="login-aside"><a class="admin-brand" href="/"><img src="/assets/logo.svg" alt="dailymattr" /></a><div class="aside-copy"><span class="admin-kicker">OPERATIONS PORTAL</span><h2>Keep every<br /><em>mattr</em> moving.</h2><p>One secure place to review support requests and keep your reader experience moving forward.</p></div><span class="aside-footer">DAILYMATTR · INTERNAL</span></aside><div class="login-form-side"><div class="login-heading"><span class="admin-kicker">PRIVATE AREA</span><h1>Welcome back</h1><p class="muted">Sign in to manage support requests.</p></div><form id="login-form"><label>Email address<input name="email" type="email" placeholder="admin@example.com" autocomplete="username" required /></label><label>Password<input name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required /></label><button>Sign in <span aria-hidden="true">→</span></button><p id="login-error" class="error"></p></form></div></section>
<section id="dashboard" hidden><header class="admin-header"><div><p class="eyebrow">Dailymattr admin</p><h1>Support messages</h1></div><button id="logout" class="secondary">Log out</button></header><section class="panel"><div class="row"><h2>Inbox</h2><button id="refresh" class="secondary">Refresh</button></div><p id="message-state" class="muted">Loading…</p><div id="messages" class="messages"></div></section><section class="panel"><h2>Change password</h2><form id="password-form" class="password-form"><input name="password" type="password" minlength="8" placeholder="New password (8+ characters)" required /><input name="confirm" type="password" minlength="8" placeholder="Confirm new password" required /><button>Update password</button><p id="password-state" class="muted"></p></form></section></section></main><script type="module" src="/src/admin.js"></script></body></html>
